<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found, Syed Zain Ul Abedin</title>
  <meta name="robots" content="noindex">
  <script>try { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light'); } catch (e) {}</script>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .lost { min-height: 100svh; display: grid; place-items: center; text-align: center; padding: var(--s-300); }
    .lost__inner { display: grid; gap: var(--s-200); justify-items: center; max-width: 520px; }
    .lost__code { font-size: 96px; line-height: 1; color: var(--accent); }
  </style>
</head>
<body>
  <main class="lost">
    <div class="lost__inner">
      <p class="lost__code mono intro" style="--d:0">404</p>
      <h1 class="section__title intro" style="--d:1">This page doesn't exist.</h1>
      <p class="body-3 muted intro" style="--d:2">The link may be old or mistyped.</p>
      <a class="btn btn--ink intro" style="--d:3" href="/"><span class="btn__label button-md">Back to the home page</span></a>
    </div>
  </main>
  <script>requestAnimationFrame(() => document.documentElement.classList.add('is-ready'));</script>
</body>
</html>
